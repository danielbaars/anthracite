name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit publication operation
        type: choice
        required: true
        default: select
        options: [select, beta, stable]
      beta_source:
        description: Full 40-character main-history source commit (beta only)
        type: string
      beta_version:
        description: Exact canonical beta version (required for either operation)
        type: string
        required: true
      stable_tag:
        description: Existing stable release tag (stable only)
        type: string
      practice:
        description: "Exact beta evidence: release:v<VERSION>/practice.json (stable only)"
        type: string
      confirmation:
        description: Exact intended stable version without v (stable only)
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare version and changelog
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Validate and publish explicitly selected npm channel
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      TERM: dumb
      NO_COLOR: "1"
      GH_TOKEN: ${{ github.token }}
      NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.17.0
      - name: Validate manual request, retain evidence and publish exact tested artifact
        run: node scripts/release-dispatch.cjs
