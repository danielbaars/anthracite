name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs['apps/cli--release_created'] }}
      sha: ${{ steps.release.outputs['apps/cli--sha'] }}
      tag: ${{ steps.release.outputs['apps/cli--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Validate and publish npm release
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TERM: dumb
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.17.0
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node -e 'require("node:assert/strict").equal(process.env.RELEASE_TAG, "v" + require("./apps/cli/package.json").version)'
      - name: Install exact dependencies
        run: node .yarn/releases/yarn-3.2.1.cjs install --immutable
      - name: Build and typecheck
        run: |
          node .yarn/releases/yarn-3.2.1.cjs turbo run build
          node .yarn/releases/yarn-3.2.1.cjs workspace @danielbaars/anthracite check
      - name: Build the npm tarball
        run: node scripts/build-npm-package.cjs
      - name: Test the exact tarball in an isolated installation
        run: node scripts/test-npm-package.cjs
      - name: Preserve the tested tarball for bootstrap and recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: |
            release/npm/danielbaars-anthracite.tgz
            release/npm/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
      - name: Publish the tested tarball with provenance
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm publish release/npm/danielbaars-anthracite.tgz --access public --provenance
