name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, typecheck and CLI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TERM: dumb
      NO_COLOR: "1"
      TEST_SHARD: "0"
      TEST_SHARDS: "1"
      TEST_FILTER: 'commands/(anthracite_identity_cli|branch/branch_(create|checkout)|log/short|log_steps_(full|short|state|options)_cli|submit_(footer_repair|ancestor_footer)_cli|delete_pr_state_cli)\.test\.js$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install exact dependencies
        run: node .yarn/releases/yarn-3.2.1.cjs install --immutable
      - name: Test release service boundary
        run: node --test scripts/test/release-services.test.cjs
      - name: Build and lint
        run: node .yarn/releases/yarn-3.2.1.cjs turbo run build
      - name: Typecheck
        run: node .yarn/releases/yarn-3.2.1.cjs workspace @danielbaars/anthracite check
      - name: Configure fixture author
        run: |
          git config --global user.name 'Anthracite CI'
          git config --global user.email 'ci@example.test'
      - name: Test Node CLI smoke files
        run: node .yarn/releases/yarn-3.2.1.cjs workspace @danielbaars/anthracite test-ci
      - name: Prepare published legacy recovery producer
        run: npm install --prefix "$RUNNER_TEMP/anthracite-legacy" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org @danielbaars/anthracite@0.6.11
      - name: Test reused-branch PR safety
        env:
          ANTHRACITE_TEST_LEGACY_BINARY: ${{ runner.temp }}/anthracite-legacy/node_modules/.bin/an
        run: |
          node node_modules/mocha/bin/mocha.js \
            apps/cli/dist/test/commands/pr_reused_branch_cli.test.js \
            apps/cli/dist/test/commands/submit_reused_branch_cli.test.js \
            apps/cli/dist/test/commands/submit_plan_inputs_cli.test.js \
            apps/cli/dist/test/commands/sync_reused_branch_cli.test.js \
            apps/cli/dist/test/commands/sync_cleanup_identity_recovery_cli.test.js \
            --grep 'prefers the unique open PR|validates a stale stored terminal PR|npm reuse:'
      - name: Build and test the npm tarball
        env:
          ANTHRACITE_TEST_LEGACY_BINARY: ${{ runner.temp }}/anthracite-legacy/node_modules/.bin/an
        run: |
          node scripts/build-npm-package.cjs
          node scripts/test-npm-package.cjs
      - name: Preserve per-file test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-results
          path: .test-results/node/0/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
